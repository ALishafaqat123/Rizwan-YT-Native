name: Temporary Preview 19 Diagnostic Windows Build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == 'Preview19 Diagnostic Build'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark diagnostic started
        shell: pwsh
        run: gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body "Preview 19 diagnostic build started."

      - uses: actions/checkout@v4
        with:
          ref: agent/pc-v1.2-preview19-clear-completed-compact-watch

      - name: Apply and verify patch chain
        shell: pwsh
        run: |
          try {
            $ErrorActionPreference = "Stop"
            python desktop-app/tools/fix_preview15_regex_replacement.py
            if ($LASTEXITCODE -ne 0) { throw "Preview15 guard failed" }
            $scripts = @(
              "desktop-app/tools/apply_v111_navigation_fix.py",
              "desktop-app/tools/apply_v112_rich_audio.py",
              "desktop-app/tools/apply_v113_webview_session_bridge.py",
              "desktop-app/tools/apply_v113_escape_fix.py",
              "desktop-app/tools/apply_v120_smart_quality.py",
              "desktop-app/tools/fix_preview2_navigation_anchor_v2.py",
              "desktop-app/tools/apply_v120_preview2_playlist_ui_settings.py",
              "desktop-app/tools/apply_v120_preview3_fast_analysis.py",
              "desktop-app/tools/fix_preview4_navigation_anchor.py",
              "desktop-app/tools/apply_v120_preview4_channel_queue_ui.py",
              "desktop-app/tools/apply_v120_preview5_channel_selector_fix.py",
              "desktop-app/tools/apply_v120_preview6_runtime_channel_injection.py",
              "desktop-app/tools/apply_v120_preview7_scroll_folders.py",
              "desktop-app/tools/apply_v120_preview8_per_card_selector.py",
              "desktop-app/tools/apply_v120_preview9_fast_visible_selector.py",
              "desktop-app/tools/fix_preview10_patch_anchor.py",
              "desktop-app/tools/apply_v120_preview10_event_driven_selector.py",
              "desktop-app/tools/fix_preview10_document_start_root.py",
              "desktop-app/tools/apply_v120_preview11_named_folder_output.py",
              "desktop-app/tools/apply_v120_preview11_hotfix1_original_audio.py",
              "desktop-app/tools/apply_v120_preview12_download_manager_ui.py",
              "desktop-app/tools/apply_v120_preview12_hotfix2_ui_stability_recovery.py",
              "desktop-app/tools/apply_v120_preview13_pause_resume.py",
              "desktop-app/tools/apply_v120_preview14_queue_first_ux.py",
              "desktop-app/tools/apply_v120_preview15_watch_multi.py",
              "desktop-app/tools/apply_v120_preview16_autoqueue_card_controls.py",
              "desktop-app/tools/apply_v120_preview17_clean_downloads_ui.py",
              "desktop-app/tools/apply_v120_preview18_smooth_smart_slots.py",
              "desktop-app/tools/apply_v120_preview19_clear_completed_compact_watch.py"
            )
            foreach ($script in $scripts) {
              Write-Host "Applying $script"
              python $script
              if ($LASTEXITCODE -ne 0) { throw "Patch failed: $script" }
            }
            $src = Get-Content "desktop-app/BrowserMainForm.cs" -Raw
            if ($src -notmatch 'downloadTray.Height = 0;') { throw "Large watch tray not hidden" }
            if ($src -notmatch 'MakeCardIconButton\("📂"') { throw "Folder icon missing" }
            if ($src -notmatch 'Open containing folder') { throw "Folder action missing" }
            if ($src -notmatch 'done.Enabled = true;') { throw "Bright completed check missing" }
            if ($src -notmatch 'TryStartWaitingResumes') { throw "Preview18 smart slots missing" }
            gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body "Patch chain passed."
          } catch {
            $msg = "PATCH FAILED: " + $_.Exception.Message
            gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body $msg
            throw
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compile Preview 19
        shell: pwsh
        run: |
          try {
            $ErrorActionPreference = "Stop"
            dotnet restore "desktop-app/RizwanMediaSaverPC.csproj"
            if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed" }
            dotnet build "desktop-app/RizwanMediaSaverPC.csproj" -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "dotnet build failed" }
            gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body "Compile passed."
          } catch {
            $msg = "COMPILE FAILED: " + $_.Exception.Message
            gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body $msg
            throw
          }

      - name: Download engines
        shell: pwsh
        run: |
          try {
            $ErrorActionPreference = "Stop"
            curl.exe -L --fail --retry 5 --retry-all-errors "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "desktop-app/tools/yt-dlp.exe"
            if ($LASTEXITCODE -ne 0) { throw "yt-dlp download failed" }
            curl.exe -L --fail --retry 5 --retry-all-errors "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -o "$env:RUNNER_TEMP/deno.zip"
            if ($LASTEXITCODE -ne 0) { throw "Deno download failed" }
            Expand-Archive "$env:RUNNER_TEMP/deno.zip" "$env:RUNNER_TEMP/deno" -Force
            Copy-Item "$env:RUNNER_TEMP/deno/deno.exe" "desktop-app/tools/deno.exe" -Force
            curl.exe -L --fail --retry 5 --retry-all-errors "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -o "$env:RUNNER_TEMP/ffmpeg.zip"
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg download failed" }
            Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" "$env:RUNNER_TEMP/ffmpeg" -Force
            $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            $ffprobe = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffprobe.exe | Select-Object -First 1
            if (-not $ffmpeg) { throw "ffmpeg.exe not found" }
            Copy-Item $ffmpeg.FullName "desktop-app/tools/ffmpeg.exe" -Force
            if ($ffprobe) { Copy-Item $ffprobe.FullName "desktop-app/tools/ffprobe.exe" -Force }
            gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body "Engine download passed."
          } catch {
            $msg = "ENGINE STEP FAILED: " + $_.Exception.Message
            gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body $msg
            throw
          }

      - name: Publish Windows app
        shell: pwsh
        run: |
          try {
            $ErrorActionPreference = "Stop"
            dotnet publish "desktop-app/RizwanMediaSaverPC.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o "desktop-app/publish"
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
            New-Item -ItemType Directory -Force "desktop-app/publish/tools" | Out-Null
            Copy-Item "desktop-app/tools/*" "desktop-app/publish/tools/" -Force
            Copy-Item "desktop-app/THIRD-PARTY-NOTICES.txt" "desktop-app/publish/THIRD-PARTY-NOTICES.txt" -Force
            gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body "Windows publish passed."
          } catch {
            $msg = "PUBLISH FAILED: " + $_.Exception.Message
            gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body $msg
            throw
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer and private prerelease
        shell: pwsh
        run: |
          try {
            $ErrorActionPreference = "Stop"
            New-Item -ItemType Directory -Force "desktop-artifacts" | Out-Null
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "desktop-app/installer.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
            $file = "desktop-artifacts/Rizwan-Media-Saver-PC-v1.2.0-Preview19-Setup.exe"
            if (-not (Test-Path $file)) { throw "Preview19 Setup EXE missing" }
            $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $tag = "pc-v1.2-preview19-clear-completed-compact-watch"
            gh release delete $tag --yes --cleanup-tag 2>$null
            gh release create $tag --title "Rizwan Media Saver PC v1.2 Preview 19" --notes "Bright completed check + per-file folder icon + hidden large watch tray. Preview 18 smart slots preserved." --prerelease
            gh release upload $tag $file --clobber
            $rel = gh api "repos/ALishafaqat123/Rizwan-YT-Native/releases/tags/$tag" | ConvertFrom-Json
            $asset = $rel.assets | Where-Object { $_.name -eq "Rizwan-Media-Saver-PC-v1.2.0-Preview19-Setup.exe" } | Select-Object -First 1
            if (-not $asset) { throw "Preview19 release asset missing" }
            New-Item -ItemType Directory -Force ".build-status" | Out-Null
            @("SUCCESS","asset_id=$($asset.id)","size=$($asset.size)","sha256=$sha") | Set-Content ".build-status/preview19-diagnostic-build.txt" -Encoding UTF8
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ".build-status/preview19-diagnostic-build.txt"
            git commit -m "Record Preview 19 diagnostic build success" || exit 0
            git push origin HEAD:agent/pc-v1.2-preview19-clear-completed-compact-watch
            gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body "Installer and private release passed. Preview 19 build SUCCESS."
          } catch {
            $msg = "INSTALLER/RELEASE FAILED: " + $_.Exception.Message
            gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body $msg
            throw
          }
