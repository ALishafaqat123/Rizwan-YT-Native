name: Export Preview 15 Signed URL

on:
  push:
    branches: [ "agent/pc-v1.2-preview15-watch-multi" ]
    paths:
      - ".github/workflows/export-preview15-signed-url.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-v1.2-preview15-watch-multi
          fetch-depth: 0
      - name: Export asset redirect and verify hash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="ALishafaqat123/Rizwan-YT-Native"
          tag="pc-v1.2-preview15-watch-multi"
          assetName="Rizwan-Media-Saver-PC-v1.2.0-Preview15-Setup.exe"
          release=$(gh api "repos/$repo/releases/tags/$tag")
          asset=$(printf '%s' "$release" | jq -c --arg n "$assetName" '.assets[] | select(.name==$n)' | head -n1)
          id=$(printf '%s' "$asset" | jq -r '.id')
          size=$(printf '%s' "$asset" | jq -r '.size')
          headers="$RUNNER_TEMP/headers.txt"
          curl -sS -D "$headers" -o /dev/null -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$repo/releases/assets/$id"
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^location:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")
          test -n "$location"
          curl -L --fail --retry 5 --retry-all-errors "$location" -o "$RUNNER_TEMP/$assetName"
          actualSize=$(stat -c%s "$RUNNER_TEMP/$assetName")
          test "$actualSize" = "$size"
          sha=$(sha256sum "$RUNNER_TEMP/$assetName" | awk '{print $1}')
          b64=$(printf '%s' "$location" | base64 -w0)
          mkdir -p .build-status
          printf 'SUCCESS\nasset_id=%s\nsize=%s\nsha256=%s\nsigned_url_b64=%s\n' "$id" "$size" "$sha" "$b64" > .build-status/preview15-export.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/preview15-export.txt
          git commit -m "Record Preview 15 verified export" || exit 0
          for n in 1 2 3; do
            git pull --rebase origin agent/pc-v1.2-preview15-watch-multi && git push origin HEAD:agent/pc-v1.2-preview15-watch-multi && exit 0
            sleep 2
          done
          exit 1
