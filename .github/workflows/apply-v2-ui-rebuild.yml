name: Apply V2 UI Rebuild

on:
  push:
    branches: [ "v2-ui-rebuild" ]
    paths:
      - ".github/workflows/apply-v2-ui-rebuild.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-ui-rebuild
          fetch-depth: 0

      - name: Generate V2 source
        run: python3 tools/apply_v2_ui_rebuild.py

      - name: Commit V2 source
        shell: bash
        run: |
          git config user.name "Rizwan Media Saver CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/rizwan/ytnativefoundation/V2MainActivity.java app/src/main/AndroidManifest.xml app/build.gradle
          git commit -m "Build V2 UI UX foundation on stable engine"
          git push origin HEAD:v2-ui-rebuild
