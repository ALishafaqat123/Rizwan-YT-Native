plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rizwan.ytnativefoundation'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rizwan.ytnative.v2preview'
        minSdk 24
        targetSdk 27
        versionCode 203
        versionName '2.0.3-native-finalize-preview'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
        abortOnError true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min:8.1.7'
}
