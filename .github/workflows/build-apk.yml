name: Temporary Preview 19 Patch Output

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  diagnose:
    if: github.event.issue.title == 'Preview19 Patch Output'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-v1.2-preview19-clear-completed-compact-watch

      - name: Apply through Preview 18 and capture Preview 19 output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          python desktop-app/tools/fix_preview15_regex_replacement.py *> $null
          if ($LASTEXITCODE -ne 0) { gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body "Preview15 guard failed"; exit 1 }
          $scripts = @(
            "desktop-app/tools/apply_v111_navigation_fix.py",
            "desktop-app/tools/apply_v112_rich_audio.py",
            "desktop-app/tools/apply_v113_webview_session_bridge.py",
            "desktop-app/tools/apply_v113_escape_fix.py",
            "desktop-app/tools/apply_v120_smart_quality.py",
            "desktop-app/tools/fix_preview2_navigation_anchor_v2.py",
            "desktop-app/tools/apply_v120_preview2_playlist_ui_settings.py",
            "desktop-app/tools/apply_v120_preview3_fast_analysis.py",
            "desktop-app/tools/fix_preview4_navigation_anchor.py",
            "desktop-app/tools/apply_v120_preview4_channel_queue_ui.py",
            "desktop-app/tools/apply_v120_preview5_channel_selector_fix.py",
            "desktop-app/tools/apply_v120_preview6_runtime_channel_injection.py",
            "desktop-app/tools/apply_v120_preview7_scroll_folders.py",
            "desktop-app/tools/apply_v120_preview8_per_card_selector.py",
            "desktop-app/tools/apply_v120_preview9_fast_visible_selector.py",
            "desktop-app/tools/fix_preview10_patch_anchor.py",
            "desktop-app/tools/apply_v120_preview10_event_driven_selector.py",
            "desktop-app/tools/fix_preview10_document_start_root.py",
            "desktop-app/tools/apply_v120_preview11_named_folder_output.py",
            "desktop-app/tools/apply_v120_preview11_hotfix1_original_audio.py",
            "desktop-app/tools/apply_v120_preview12_download_manager_ui.py",
            "desktop-app/tools/apply_v120_preview12_hotfix2_ui_stability_recovery.py",
            "desktop-app/tools/apply_v120_preview13_pause_resume.py",
            "desktop-app/tools/apply_v120_preview14_queue_first_ux.py",
            "desktop-app/tools/apply_v120_preview15_watch_multi.py",
            "desktop-app/tools/apply_v120_preview16_autoqueue_card_controls.py",
            "desktop-app/tools/apply_v120_preview17_clean_downloads_ui.py",
            "desktop-app/tools/apply_v120_preview18_smooth_smart_slots.py"
          )
          foreach ($script in $scripts) {
            python $script *> $null
            if ($LASTEXITCODE -ne 0) {
              gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body "Earlier patch failed unexpectedly: $script"
              exit 1
            }
          }
          $output = & python desktop-app/tools/apply_v120_preview19_clear_completed_compact_watch.py 2>&1
          $code = $LASTEXITCODE
          $text = ($output | ForEach-Object { $_.ToString() }) -join "`n"
          if ($text.Length -gt 5000) { $text = $text.Substring([Math]::Max(0, $text.Length - 5000)) }
          gh issue comment $env:ISSUE_NUMBER --repo ALishafaqat123/Rizwan-YT-Native --body ("Preview19 patch output:`n```text`n" + $text + "`n```" )
          exit $code
