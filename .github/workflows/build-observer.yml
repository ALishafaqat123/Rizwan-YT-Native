name: Build SnapTube Observer APK

on:
  workflow_dispatch:
  push:
    branches: [ "v2-ui-rebuild" ]
    paths:
      - "observer-app/**"
      - ".github/workflows/build-observer.yml"

permissions:
  contents: read

jobs:
  build:
    name: Assemble verified SnapTube Observer APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: v2-ui-rebuild

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build unsigned observer release APK
        shell: bash
        run: gradle -p observer-app --no-daemon --stacktrace clean assembleRelease

      - name: Align and sign observer APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p observer-artifacts
          UNSIGNED="observer-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="observer-artifacts/SnapTube-Observer-v1.0.0-aligned-unsigned.apk"
          FINAL="observer-artifacts/SnapTube-Observer-v1.0.0.apk"
          test -f "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks app/rizwan-test-signing.keystore \
            --ks-key-alias rizwan_test \
            --ks-pass pass:RizwanTest2026 \
            --key-pass pass:RizwanTest2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out "$FINAL" \
            "$ALIGNED"
          rm -f "$ALIGNED"

      - name: Verify APK signature and Android metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="observer-artifacts/SnapTube-Observer-v1.0.0.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 24 "$APK" | tee observer-artifacts/SIGNATURE-ANDROID8.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" observer-artifacts/SIGNATURE-ANDROID8.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$APK" | tee observer-artifacts/SIGNATURE-V1-COMPAT.txt
          grep -q "Verified using v1 scheme (JAR signing): true" observer-artifacts/SIGNATURE-V1-COMPAT.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20 | tee observer-artifacts/APK-BADGING.txt
          grep -q "package: name='com.rizwan.snaptubeobserver'" observer-artifacts/APK-BADGING.txt
          grep -q "versionCode='1'" observer-artifacts/APK-BADGING.txt
          grep -q "versionName='1.0.0-observer'" observer-artifacts/APK-BADGING.txt
          grep -q "application-label:'SnapTube Observer'" observer-artifacts/APK-BADGING.txt
          grep -q "sdkVersion:'24'" observer-artifacts/APK-BADGING.txt
          sha256sum "$APK" | tee observer-artifacts/SHA256.txt

      - name: Upload verified observer APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapTube-Observer-v1.0.0-Verified-APK
          path: observer-artifacts/
          if-no-files-found: error
          retention-days: 14
