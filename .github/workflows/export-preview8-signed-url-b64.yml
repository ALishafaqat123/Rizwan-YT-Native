name: Export Preview 8 Signed URL Encoded
on:
  workflow_dispatch:
  push:
    branches: [ "agent/pc-v1.2-preview8-per-card-selector" ]
    paths: [ ".github/workflows/export-preview8-signed-url-b64.yml" ]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Get encoded temporary release asset URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          headers=$(mktemp)
          curl -sS -D "$headers" -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ALishafaqat123/Rizwan-YT-Native/releases/assets/516594430"
          location=$(tr -d '\r' < "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^location:[[:space:]]*/, ""); print; exit}')
          test -n "$location"
          echo "SIGNED_URL_B64_BEGIN"
          printf '%s' "$location" | base64 -w0
          echo
          echo "SIGNED_URL_B64_END"
