name: Export Preview 16 Signed URL

on:
  push:
    branches: [ "agent/pc-v1.2-preview16-autoqueue-card-controls" ]
    paths:
      - ".github/workflows/export-preview16-signed-url-b64.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-v1.2-preview16-autoqueue-card-controls
      - name: Export and verify asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="ALishafaqat123/Rizwan-YT-Native"
          tag="pc-v1.2-preview16-autoqueue-card-controls"
          file="Rizwan-Media-Saver-PC-v1.2.0-Preview16-Setup.exe"
          release=$(gh api "repos/$repo/releases/tags/$tag")
          asset_id=$(printf '%s' "$release" | jq -r --arg f "$file" '.assets[] | select(.name==$f) | .id' | head -n1)
          size=$(printf '%s' "$release" | jq -r --arg f "$file" '.assets[] | select(.name==$f) | .size' | head -n1)
          test -n "$asset_id"
          headers=$(mktemp)
          curl -sS -D "$headers" -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$repo/releases/assets/$asset_id"
          location=$(grep -i '^location:' "$headers" | head -n1 | sed -E 's/^location:[[:space:]]*//I' | tr -d '\r')
          test -n "$location"
          curl -L --fail --retry 5 --retry-all-errors "$location" -o "$file"
          sha=$(sha256sum "$file" | awk '{print $1}')
          actual_size=$(stat -c '%s' "$file")
          test "$actual_size" = "$size"
          b64=$(printf '%s' "$location" | base64 -w0)
          mkdir -p .build-status
          printf 'SUCCESS\nasset_id=%s\nsize=%s\nsha256=%s\nsigned_url_b64=%s\n' "$asset_id" "$size" "$sha" "$b64" > .build-status/preview16-export.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/preview16-export.txt
          git commit -m "Record Preview 16 export" || exit 0
          git push origin HEAD:agent/pc-v1.2-preview16-autoqueue-card-controls
