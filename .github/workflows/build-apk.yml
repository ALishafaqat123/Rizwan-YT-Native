name: Temporary Preview 19 Signed URL Export

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  export:
    if: github.event.issue.title == 'Preview19 Signed URL'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Export signed asset URL as base64
        shell: bash
        run: |
          set -euo pipefail
          ASSET_ID=526216375
          HDR=$(mktemp)
          curl -sS -D "$HDR" -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ALishafaqat123/Rizwan-YT-Native/releases/assets/$ASSET_ID"
          LOCATION=$(tr -d '\r' < "$HDR" | awk 'BEGIN{IGNORECASE=1} /^location: /{sub(/^location: /,""); print; exit}')
          if [ -z "$LOCATION" ]; then
            echo "No signed Location header" >&2
            cat "$HDR" >&2
            exit 1
          fi
          B64=$(printf '%s' "$LOCATION" | base64 -w0)
          gh issue comment "$ISSUE_NUMBER" --repo ALishafaqat123/Rizwan-YT-Native --body "SIGNED_URL_B64=$B64"
