name: Export Preview 3 Signed URL

on:
  workflow_dispatch:
  push:
    branches: [ "agent/pc-v1.2-preview3-fast-analysis" ]
    paths:
      - ".github/workflows/export-preview3-signed-url.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Get temporary signed release asset URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          headers=$(mktemp)
          curl -sS -D "$headers" -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ALishafaqat123/Rizwan-YT-Native/releases/assets/512663502"
          location=$(tr -d '\r' < "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^location:[[:space:]]*/, ""); print; exit}')
          if [ -z "$location" ]; then
            echo "SIGNED_URL_NOT_FOUND"
            cat "$headers"
            exit 1
          fi
          echo "SIGNED_URL_BEGIN"
          echo "$location"
          echo "SIGNED_URL_END"
