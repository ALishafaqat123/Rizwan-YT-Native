plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rizwan.ytnativefoundation'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rizwan.ytnative'
        minSdk 24
        targetSdk 27
        versionCode 158
        versionName '1.5.8-install-compat'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        rmsTest {
            storeFile file('rizwan-test-signing.keystore')
            storePassword 'RizwanTest2026'
            keyAlias 'rizwan_test'
            keyPassword 'RizwanTest2026'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.rmsTest
        }
        release {
            signingConfig signingConfigs.rmsTest
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
