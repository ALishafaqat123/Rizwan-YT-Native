name: Apply V2.0.5 Media3 Batched Patch

on:
  push:
    branches: [ "v2-ui-rebuild" ]
    paths:
      - '.github/scripts/v205_media3_batched.py'
      - '.github/workflows/apply-v205-media3-batched.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-ui-rebuild
      - name: Apply V2.0.5 Media3 batched source patch
        run: python3 .github/scripts/v205_media3_batched.py
      - name: Commit source and build config only
        shell: bash
        run: |
          set -e
          git config user.name "Rizwan Media Saver CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/rizwan/ytnativefoundation/V2MainActivity.java app/build.gradle
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Test Media3 batched MP4 finalize"
            git push origin HEAD:v2-ui-rebuild
          fi
