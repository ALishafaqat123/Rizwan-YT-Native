name: Export Preview 18 Signed URL

on:
  push:
    branches: [ "agent/pc-v1.2-preview18-smooth-smart-slots" ]
    paths:
      - ".github/workflows/export-preview18-signed-url-b64.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-v1.2-preview18-smooth-smart-slots

      - name: Export and hash private installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="ALishafaqat123/Rizwan-YT-Native"
          tag="pc-v1.2-preview18-smooth-smart-slots"
          assetName="Rizwan-Media-Saver-PC-v1.2.0-Preview18-Setup.exe"
          rel=$(gh api "repos/$repo/releases/tags/$tag")
          id=$(printf '%s' "$rel" | jq -r --arg n "$assetName" '.assets[] | select(.name==$n) | .id' | head -n1)
          size=$(printf '%s' "$rel" | jq -r --arg n "$assetName" '.assets[] | select(.name==$n) | .size' | head -n1)
          test -n "$id"

          headers="$RUNNER_TEMP/p18-headers.txt"
          curl -sS -D "$headers" -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$repo/releases/assets/$id"
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^location:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")
          test -n "$location"
          curl -L --fail --retry 5 --retry-all-errors "$location" -o "$RUNNER_TEMP/$assetName"
          sha=$(sha256sum "$RUNNER_TEMP/$assetName" | awk '{print $1}')
          b64=$(printf '%s' "$location" | base64 -w0)

          mkdir -p .build-status
          {
            echo SUCCESS
            echo "asset_id=$id"
            echo "size=$size"
            echo "sha256=$sha"
            echo "signed_url_b64=$b64"
          } > .build-status/preview18-export.txt

      - name: Record export
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/preview18-export.txt
          git commit -m "Record Preview 18 signed export" || exit 0
          git pull --rebase origin agent/pc-v1.2-preview18-smooth-smart-slots || true
          git push origin HEAD:agent/pc-v1.2-preview18-smooth-smart-slots

# trigger registered export workflow
