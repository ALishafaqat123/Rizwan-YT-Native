name: Apply V2.0.2 Fast Finalize Patch

on:
  push:
    branches: [ "v2-ui-rebuild" ]
    paths:
      - '.github/scripts/v202_fast_finalize.py'
      - '.github/workflows/apply-v202-fast-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-ui-rebuild
      - name: Apply V2.0.2 source patch
        run: python3 .github/scripts/v202_fast_finalize.py
      - name: Commit patched source
        shell: bash
        run: |
          set -e
          git config user.name "Rizwan Media Saver CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/rizwan/ytnativefoundation/V2MainActivity.java
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add progressive fast path and timed fast mux"
            git push origin HEAD:v2-ui-rebuild
          fi
