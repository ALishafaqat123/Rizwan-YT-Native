name: Apply v1.8.2 Progress Polish

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-v182-progress-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply_v182_progress_polish.py

      - name: Commit patched release
        shell: bash
        run: |
          git config user.name "Rizwan Media Saver CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release v1.8.2 progress and playlist UI polish"
          git push origin HEAD:main

# one-time trigger
