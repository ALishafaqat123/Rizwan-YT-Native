name: Build Rizwan Media Saver V2 APK

on:
  workflow_dispatch:
  push:
    branches: [ "v2-ui-rebuild" ]

permissions:
  contents: read

jobs:
  build:
    name: Assemble verified V2.0.5 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V2 source
        uses: actions/checkout@v4
        with:
          ref: v2-ui-rebuild

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build unsigned V2.0.5 release APK
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Align and explicitly sign APK with v1 and v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="artifacts/Rizwan-Media-Saver-V2-v2.0.5-aligned-unsigned.apk"
          FINAL="artifacts/Rizwan-Media-Saver-V2-v2.0.5-Media3-Batched.apk"
          test -f "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks app/rizwan-test-signing.keystore \
            --ks-key-alias rizwan_test \
            --ks-pass pass:RizwanTest2026 \
            --key-pass pass:RizwanTest2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out "$FINAL" \
            "$ALIGNED"
          rm -f "$ALIGNED"

      - name: Verify APK signature, alignment and Android metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/Rizwan-Media-Saver-V2-v2.0.5-Media3-Batched.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 24 "$APK" | tee artifacts/SIGNATURE-ANDROID8.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" artifacts/SIGNATURE-ANDROID8.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$APK" | tee artifacts/SIGNATURE-V1-COMPAT.txt
          grep -q "Verified using v1 scheme (JAR signing): true" artifacts/SIGNATURE-V1-COMPAT.txt
          jarsigner -verify -certs "$APK" | tee artifacts/JARSIGNER-VERIFICATION.txt
          grep -q "jar verified" artifacts/JARSIGNER-VERIFICATION.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20 | tee artifacts/APK-BADGING.txt
          grep -q "package: name='com.rizwan.ytnative.v2preview'" artifacts/APK-BADGING.txt
          grep -q "versionCode='205'" artifacts/APK-BADGING.txt
          grep -q "versionName='2.0.5-media3-batched-preview'" artifacts/APK-BADGING.txt
          grep -q "application-label:'Rizwan Media Saver V2'" artifacts/APK-BADGING.txt
          grep -q "sdkVersion:'24'" artifacts/APK-BADGING.txt
          sha256sum "$APK" | tee artifacts/SHA256.txt

      - name: Upload verified V2.0.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Rizwan-Media-Saver-V2-v2.0.5-Media3-Batched-Verified-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
