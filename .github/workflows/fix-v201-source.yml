name: Fix V2.0.1 Source

on:
  push:
    branches: [ "v2-ui-rebuild" ]
    paths:
      - ".github/workflows/fix-v201-source.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-ui-rebuild
      - name: Apply source safety fix
        run: python .github/scripts/fix-v201-source.py
      - name: Commit fixed source
        shell: bash
        run: |
          set -e
          git config user.name "Rizwan Media Saver CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/rizwan/ytnativefoundation/V2MainActivity.java
          git diff --cached --quiet && exit 0
          git commit -m "Fix V2.0.1 source safety issues"
          git push origin HEAD:v2-ui-rebuild
