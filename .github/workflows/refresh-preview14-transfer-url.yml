name: Refresh Preview 14 Transfer URL

on:
  workflow_dispatch:
  push:
    branches: [ "agent/pc-v1.2-preview14-queue-first-ux" ]
    paths:
      - ".github/workflows/refresh-preview14-transfer-url.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-v1.2-preview14-queue-first-ux
      - name: Export fresh signed URL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "ALishafaqat123/Rizwan-YT-Native"
          $tag = "pc-v1.2-preview14-queue-first-ux"
          $assetName = "Rizwan-Media-Saver-PC-v1.2.0-Preview14-Setup.exe"
          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (-not $asset) { throw "Preview 14 asset not found" }
          $headers = Join-Path $env:RUNNER_TEMP "p14-refresh-headers.txt"
          curl.exe -sS -D $headers -o NUL -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$repo/releases/assets/$($asset.id)"
          $locationLine = Get-Content $headers | Where-Object { $_ -match '^location:' } | Select-Object -First 1
          if (-not $locationLine) { throw "Signed asset redirect missing" }
          $location = ($locationLine -replace '^location:\s*','').Trim()
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($location))
          New-Item -ItemType Directory -Force -Path ".build-status" | Out-Null
          @(
            "SUCCESS",
            "asset_id=$($asset.id)",
            "size=$($asset.size)",
            "sha256=2ed5d7394766b49667f8e2d213f59d3877728d2a3f0b2e77f11652b7a0f2a24c",
            "signed_url_b64=$b64"
          ) | Set-Content ".build-status/preview14-refresh.txt" -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".build-status/preview14-refresh.txt"
          git commit -m "Refresh Preview 14 signed transfer URL" || exit 0
          git push origin HEAD:agent/pc-v1.2-preview14-queue-first-ux
